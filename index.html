<!--
=====================  КАРТА КОДА  =====================
Файл состоит из трёх частей:
  1) CSS (блок style) — внешний вид: цвета, меню, карточки. Помечено «[CSS]»
  2) HTML — каркас страницы: шапка, меню вкладок, окно настроек. Помечено «[HTML]»

       1 Инструменты · 2 Данные сайта · 3 Темы · 4 Вкладки · 5 Роли/уровни/значки/титулы · 6 Эмодзи

<style>
/* ===== [CSS] ЦВЕТА И ОБЩИЕ СТИЛИ: переменные --p, --o, --v — главные цвета сайта ===== */
:root{--bg:#fff3f9;--sf:#fff;--ink:#2b1040;--mu:#6d5482;--li:#ead9ff;--ln:#f0cfe4;--p:#ff4fa3;--o:#b23fe0;--v:#6a2fd0;--r:24px;--hf:'Unbounded';
--g:linear-gradient(120deg,var(--p),var(--o) 55%,var(--v));box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs,16px)/1.55 var(--bf,'Onest'),system-ui,sans-serif}

.w{max-width:var(--w,980px);margin:0 auto;padding:0 18px}
header{background:var(--g);color:#fff;padding:44px 0 70px}
header h1{font-size:clamp(26px,5vw,46px)}header p{margin:10px 0 0;opacity:.95;max-width:34em}

nav .w{display:flex;gap:6px;overflow-x:auto;padding:8px 18px;background:var(--sf);border:1px solid var(--ln);border-radius:999px;max-width:960px;box-shadow:0 14px 34px -18px rgba(106,47,208,.5)}

.c{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:20px;margin-bottom:16px}

.btn{display:inline-block;border:0;border-radius:999px;padding:10px 20px;font:600 15px 'Onest';background:var(--g);color:#fff;cursor:pointer;text-decoration:none}

input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--ln);border-radius:14px;padding:9px 12px;max-width:100%}

.f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.f>input[type=text],.f>input:not([type]){flex:1;min-width:140px}

.g img{width:100%;height:140px;object-fit:cover;border-radius:14px}
.post img{max-width:100%;border-radius:16px;margin-top:10px}.post p{white-space:pre-wrap;margin:6px 0}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

.d.on{border-color:var(--o)}.d i{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}.d b{width:9px;height:9px;border-radius:50%}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.ed{min-height:90px;border:1.5px solid var(--ln);border-radius:14px;padding:9px 12px;background:var(--bg);width:100%;overflow-wrap:anywhere}.ed.sm{min-height:40px;flex:1}.ed:empty:before{content:attr(data-ph);color:var(--mu)}

dialog{background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:var(--r);width:min(660px,94vw);max-height:88vh;padding:0;box-shadow:0 30px 80px #000a}dialog::backdrop{background:#000a;backdrop-filter:blur(3px)}

#gm button{border:0;background:none;color:var(--ink);font:600 14px 'Onest';text-align:left;padding:11px 14px;border-radius:12px;cursor:pointer}#gm button:hover{background:var(--li)}
#mtb:empty{display:none}
.ep{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:8px;margin-top:8px;max-width:340px;box-shadow:0 14px 34px -14px #0007}
.ept{display:flex;gap:4px;margin-bottom:6px}.ept button,.epg button{border:0;background:none;font-size:24px;cursor:pointer;border-radius:10px;padding:2px 4px}.ept button:hover,.epg button:hover{background:var(--li)}
.epg{display:flex;flex-wrap:wrap;max-height:200px;overflow:auto}
.fpk{position:fixed;right:14px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:6}.fpk .ep{position:absolute;right:0;bottom:46px;width:min(340px,86vw)}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px}.mc{aspect-ratio:1;font-size:32px;border:0;border-radius:16px;background:var(--li);cursor:pointer}.mc.on{background:var(--g)}
#fx,.fxb{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}#fx i,.fxb i{position:absolute;top:-30px;font-style:normal;opacity:.75;animation:fl linear infinite}.fxb i{animation-iteration-count:1}

.fr-gold{box-shadow:0 0 0 3px #ffd54a,0 0 16px #ffd54a}.fr-rainbow{box-shadow:0 0 0 4px #ff4fa3,0 0 0 8px #4aa3ff}.fr-neon{box-shadow:0 0 0 3px #7dfcff,0 0 18px #7dfcff}.fr-pink{box-shadow:0 0 0 3px #ff4fa3,0 0 16px #ff4fa3}

.sp{background:var(--ink);color:transparent;border-radius:6px;cursor:pointer;padding:0 4px}.sp.show{background:var(--li);color:inherit}

@media(max-width:600px){nav{left:6px}nav .w{padding:5px}.t{padding:9px!important}#m{padding-left:50px!important}.w{padding:0 12px}}

header{background-image:radial-gradient(#fff9 1px,transparent 1.5px),radial-gradient(#fff6 1px,transparent 1.5px),var(--g);background-size:90px 90px,140px 140px,auto;background-position:0 0,40px 60px,0 0}

/* ===== [КОД: онлайн-база] Firebase Realtime Database через обычные запросы (без SDK) =====
   Адрес базы — ваш. Сайт хранит данные в ветках: site/<раздел> и reviews/<id>; регистрации в форме — в site_users. */
const FBURL="https://star-novel-6c2f2-default-rtdb.firebaseio.com";
const FBX=async(p,m,b)=>{const r=await fetch(FBURL+'/'+p+'.json',{method:m||'GET',body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw new Error('fb '+r.status);return r.json()};
const FB={doc:p=>({id:p.split('/').pop(),
  async get(){const v=await FBX(p);return{id:p.split('/').pop(),exists:v!==null,data:()=>v}},
  async set(o){await FBX(p,'PUT',o)},async delete(){await FBX(p,'DELETE')}}),
 collection:p=>({async get(){const v=(await FBX(p))||{};return{docs:Object.entries(v).map(([id,o])=>({id,exists:true,data:()=>o}))}}})};
async function fbInit(){try{await FBX('site','GET');return FB}catch{return null}}
document.addEventListener('click',e=>{
 const btn=e.target.closest('#regBtn');if(!btn)return;
 const name=document.getElementById('username')?.value.trim(),email=document.getElementById('useremail')?.value.trim(),st=document.getElementById('statusMsg');
 const say=(t,c)=>{if(st){st.innerText=t;st.style.color=c}};
 if(!name||!email)return say('❌ Пожалуйста, заполни все поля!','#ff4fa3');
 FBX('site_users','POST',{username:name,email,userAgent:navigator.userAgent,date:new Date().toLocaleString()})
  .then(()=>{say('🎉 Успешно! Данные сохранены в базе.','#b23fe0');document.getElementById('username').value='';document.getElementById('useremail').value=''})
  .catch(()=>say('Ошибка: не удалось записать в базу (проверьте правила в консоли Firebase)','#6a2fd0'));
});
